<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverBot Solutions - Robot Allocation System</title>
    <style>
        :root {
            /* Everest Engineering PDF-inspired color scheme */
            --amber: #f59e0b;
            --amber-hover: #d97706;
            --amber-light: #fef3c7;
            --dark-grey: #1f2937;
            --dark-grey-light: #374151;
            --light-beige: #fffbeb;
            --white: #ffffff;
            --border: #d97706;
            --success: #059669;
            --error: #dc2626;
            --warning: #f59e0b;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(31, 41, 55, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--light-beige);
            color: var(--dark-grey);
            line-height: 1.6;
            padding: 1.5rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            margin-bottom: 1.5rem;
            text-align: center;
            padding: 1rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--amber);
        }
        h1 {
            color: var(--dark-grey);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        h1::before { content: "🤖 "; }
        p { color: var(--dark-grey-light); }
        .card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border: 1px solid var(--amber-light);
        }
        .form-group { margin-bottom: 1rem; }
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--dark-grey);
        }
        input, select {
            width: 100%;
            padding: 0.6rem;
            border: 2px solid var(--amber-light);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: var(--white);
            color: var(--dark-grey);
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }
        button {
            background: var(--amber);
            color: var(--dark-grey);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            border: 2px solid var(--amber-hover);
        }
        button:hover {
            background: var(--amber-hover);
            transform: translateY(-1px);
        }
        button:active { transform: translateY(0); }
        button:disabled {
            background: var(--dark-grey-light);
            color: var(--light-beige);
            border-color: var(--dark-grey);
            cursor: not-allowed;
            transform: none;
        }
        .output-box {
            background: var(--dark-grey);
            color: var(--amber-light);
            padding: 1rem;
            border-radius: 6px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            min-height: 120px;
            white-space: pre-wrap;
            border-left: 4px solid var(--amber);
        }
        .success { border-left-color: var(--success); }
        .error {
            color: var(--amber-light);
            background: rgba(220, 38, 38, 0.2);
            padding: 0.5rem;
            border-radius: 4px;
        }
        .warning {
            color: var(--amber);
            font-weight: 600;
        }
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Subtle section dividers */
        section.card h2 {
            color: var(--dark-grey);
            border-bottom: 2px solid var(--amber-light);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .grid-3 { grid-template-columns: 1fr; }
            body { padding: 1rem; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>EverBot Solutions</h1>
            <p>Terminal-compliant allocation system accessible via browser.</p>
        </header>

        <section class="card">
            <form id="allocForm">
                <div class="form-group">
                    <label for="level">Strategy Level</label>
                    <select id="level" required>
                        <option value="1">Level 1: Category Distribution</option>
                        <option value="2">Level 2: Cost Optimisation</option>
                        <option value="3">Level 3: Standby Activation</option>
                        <option value="4">Level 4: Multi-Client Allocation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Enter Daily Fleet Inventory (Number of Robots Available)</label>
                    <div class="grid-3">
                        <input type="number" id="bravo" placeholder="Bravo count" min="0" required>
                        <input type="number" id="charlie" placeholder="Charlie count" min="0" required>
                        <input type="number" id="delta" placeholder="Delta count" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="hours_input">Client Work Hours</label>
                    <input type="text" id="hours_input" placeholder="e.g. 20" required>
                    <small id="hours-hint" style="color: var(--dark-grey-light); font-size: 0.85rem; margin-top: 0.3rem; display: block;">
                        Single value for Levels 1–3
                    </small>
                </div>

                <button type="submit" id="submitBtn">Calculate Allocation</button>
            </form>
        </section>

        <section class="card">
            <h2>Allocation Output</h2>
            <div id="output" class="output-box">Results will appear here after calculation...</div>
        </section>
    </main>

    <!-- External JS file (bypasses CSP, same logic) -->
    <script src="/static/app.js" defer></script>
</body>
</html>
</body>
</html>
