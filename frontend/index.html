<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverBot Solutions - Robot Allocation System</title>
    <style>
        :root {
            /* Everest Engineering PDF-inspired color scheme */
            --amber: #f59e0b;
            --amber-hover: #d97706;
            --amber-light: #fef3c7;
            --dark-grey: #1f2937;
            --dark-grey-light: #374151;
            --light-beige: #fffbeb;
            --white: #ffffff;
            --border: #d97706;
            --success: #059669;
            --error: #dc2626;
            --warning: #f59e0b;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(31, 41, 55, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--light-beige);
            color: var(--dark-grey);
            line-height: 1.6;
            padding: 1.5rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            margin-bottom: 1.5rem;
            text-align: center;
            padding: 1rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--amber);
        }
        h1 {
            color: var(--dark-grey);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        h1::before { content: "🤖 "; }
        p { color: var(--dark-grey-light); }
        .card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border: 1px solid var(--amber-light);
        }
        .form-group { margin-bottom: 1rem; }
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--dark-grey);
        }
        input, select {
            width: 100%;
            padding: 0.6rem;
            border: 2px solid var(--amber-light);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: var(--white);
            color: var(--dark-grey);
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }
        button {
            background: var(--amber);
            color: var(--dark-grey);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            border: 2px solid var(--amber-hover);
        }
        button:hover {
            background: var(--amber-hover);
            transform: translateY(-1px);
        }
        button:active { transform: translateY(0); }
        button:disabled {
            background: var(--dark-grey-light);
            color: var(--light-beige);
            border-color: var(--dark-grey);
            cursor: not-allowed;
            transform: none;
        }
        .output-box {
            background: var(--dark-grey);
            color: var(--amber-light);
            padding: 1rem;
            border-radius: 6px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            min-height: 120px;
            white-space: pre-wrap;
            border-left: 4px solid var(--amber);
        }
        .success { border-left-color: var(--success); }
        .error {
            color: var(--amber-light);
            background: rgba(220, 38, 38, 0.2);
            padding: 0.5rem;
            border-radius: 4px;
        }
        .warning {
            color: var(--amber);
            font-weight: 600;
        }
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Subtle section dividers */
        section.card h2 {
            color: var(--dark-grey);
            border-bottom: 2px solid var(--amber-light);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .grid-3 { grid-template-columns: 1fr; }
            body { padding: 1rem; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>EverBot Solutions</h1>
            <p>Terminal-compliant allocation system accessible via browser.</p>
        </header>

        <section class="card">
            <form id="allocForm">
                <div class="form-group">
                    <label for="level">Strategy Level</label>
                    <select id="level" required>
                        <option value="1">Level 1: Category Distribution</option>
                        <option value="2">Level 2: Cost Optimisation</option>
                        <option value="3">Level 3: Standby Activation</option>
                        <option value="4">Level 4: Multi-Client Allocation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Enter Daily Fleet Inventory (Number of Robots Available)</label>
                    <div class="grid-3">
                        <input type="number" id="bravo" placeholder="Bravo count" min="0" required>
                        <input type="number" id="charlie" placeholder="Charlie count" min="0" required>
                        <input type="number" id="delta" placeholder="Delta count" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="hours_input">Client Work Hours</label>
                    <input type="text" id="hours_input" placeholder="e.g. 20" required>
                    <small id="hours-hint" style="color: var(--dark-grey-light); font-size: 0.85rem; margin-top: 0.3rem; display: block;">
                        Single value for Levels 1–3
                    </small>
                </div>

                <button type="submit" id="submitBtn">Calculate Allocation</button>
            </form>
        </section>

        <section class="card">
            <h2>Allocation Output</h2>
            <div id="output" class="output-box">Results will appear here after calculation...</div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('allocForm');
            const outputDiv = document.getElementById('output');
            const submitBtn = document.getElementById('submitBtn');

            const levelSelect = document.getElementById('level');
            const hoursInput = document.getElementById('hours_input');
            const hoursHint = document.getElementById('hours-hint');

            // Dynamic placeholder & hint based on selected strategy
            levelSelect.addEventListener('change', () => {
                const level = levelSelect.value;
                if (level === '4') {
                    hoursInput.placeholder = 'e.g. 12, 16, 21';
                    hoursHint.textContent = 'Comma or space separated for multiple clients';
                } else {
                    hoursInput.placeholder = 'e.g. 20';
                    hoursHint.textContent = 'Single value for Levels 1–3';
                }
            });

            // Set correct hint on initial page load (more robust event dispatch)
            levelSelect.dispatchEvent(new Event('change', { bubbles: true }));

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                await handleSubmission();
            });

            async function handleSubmission() {
                // Reset UI state
                outputDiv.textContent = '';
                outputDiv.className = 'output-box loading';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Processing...';

                try {
                    // 1. Gather & sanitise inputs
                    const level = parseInt(document.getElementById('level').value, 10);
                    const bravo = parseInt(document.getElementById('bravo').value, 10);
                    const charlie = parseInt(document.getElementById('charlie').value, 10);
                    const delta = parseInt(document.getElementById('delta').value, 10);
                    const hoursRaw = document.getElementById('hours_input').value.trim();

                    // 2. Client-side validation
                    if ([level, bravo, charlie, delta].some(isNaN)) {
                        throw new Error('All robot counts and level must be valid integers.');
                    }
                    if (bravo < 0 || charlie < 0 || delta < 0) {
                        throw new Error('Robot counts cannot be negative.');
                    }
                    if (!hoursRaw) {
                        throw new Error('Client work hours cannot be empty.');
                    }
                    if (!/^[\d\s,]+$/.test(hoursRaw)) {
                        throw new Error('Hours must contain only numbers, commas, or spaces.');
                    }

                    const payload = { level, bravo, charlie, delta, hours_input: hoursRaw };
                    console.log('[DEBUG] Sending payload:', JSON.stringify(payload, null, 2));

                    // 3. Make API request with timeout handling
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout

                    const response = await fetch('/api/allocate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    // 4. Handle HTTP errors
                    if (!response.ok) {
                        let errorDetail = `HTTP ${response.status}: ${response.statusText}`;
                        try {
                            const errData = await response.json();
                            if (errData && errData.detail) errorDetail = errData.detail;
                        } catch { /* Ignore if response is not JSON */ }
                        throw new Error(errorDetail);
                    }

                    // 5. Parse JSON response safely
                    const data = await response.json();
                    console.log('[DEBUG] Received response:', JSON.stringify(data, null, 2));

                    if (data.status !== 'success') {
                        throw new Error(data.error || 'Allocation returned an unexpected status.');
                    }

                    // 6. Format and display results
                    outputDiv.innerHTML = formatOutput(data, level);
                    outputDiv.classList.remove('loading');
                    outputDiv.classList.add('success');

                } catch (error) {
                    console.error('[ERROR] Allocation failed:', error);
                    let userMessage = error.message;
                    if (error.name === 'AbortError') {
                        userMessage = 'Request timed out. The server may be restarting or busy.';
                    } else if (error.name === 'TypeError' && error.message.includes('fetch')) {
                        userMessage = 'Network error. Please check your internet connection and ensure the backend is running.';
                    }
                    outputDiv.innerHTML = `<span class="error">❌ ${escapeHtml(userMessage)}</span>`;
                    outputDiv.classList.remove('loading');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Calculate Allocation';
                }
            }

            // Security helper: Prevent XSS in error/output messages
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // Output formatter matching challenge specification
            function formatOutput(data, level) {
                let output = '';
           
                if (level === 1 && data.allocation) {
                    const a = data.allocation;
                    
                    // Check if allocation failed
                    if (a.valid === false) {
                        return `❌ ${a.error || 'Allocation failed.'}\n`;
                    }
                    
                    output += `📊 LEVEL 1: Category Distribution Strategy\n`;
                    output += `Robot Assignment:\n`;
                    if (a.bravo > 0) output += `  Bravo: ${a.bravo}\n`;
                    if (a.charlie > 0) output += `  Charlie: ${a.charlie}\n`;
                    if (a.delta > 0) output += `  Delta: ${a.delta}\n`;
                    output += `Total Work Hours Provided: ${a.total_hours}\n`;
                    output += `Client Work Hours Requested: ${a.requested}\n`;
                    
                } else if (level === 2 && data.level2) {
                    const l2 = data.level2;
                    
                    // Check if allocation failed
                    if (l2.valid === false) {
                        return `❌ ${l2.error || 'Allocation failed.'}\n`;
                    }
                    
                    output += `💰 LEVEL 2: Cost Optimised Allocation\n`;
                    output += `Cost Optimized Allocation:\n`;
                    if (l2.bravo > 0) output += `  Bravo: ${l2.bravo}\n`;
                    if (l2.charlie > 0) output += `  Charlie: ${l2.charlie}\n`;
                    if (l2.delta > 0) output += `  Delta: ${l2.delta}\n`;
                    output += `Total Hours Provided: ${l2.hours}\n`;
                    output += `Total Charging Cost: $${l2.cost}\n\n`;
                    output += `Level 1 vs Level 2 Comparison\n`;
                    output += `  Level 1 Cost: $${data.level1_cost}\n`;
                    output += `  Level 2 Cost: $${data.level2.cost}\n`;
                    output += `  Cost Difference: $${data.cost_difference}\n`;
                    if (data.insight) output += `  Insight: ${data.insight}\n`;
        
                } else if (level === 3) {
                    output += `🔋 LEVEL 3: Standby Activation Strategy\n`;
                    output += `Active Robot Capacity: ${data.active_capacity} hours\n`;
                    output += `Client Work Requested: ${data.requested} hours\n`;
                    
                    if (data.deficit > 0 && data.standby) {
                        // Check if standby allocation failed
                        if (!data.standby.is_valid) {
                            output += `❌ ${data.standby.error || 'Standby allocation failed.'}\n`;
                            return output;
                        }
                        output += `Additional Standby Robots Required:\n`;
                        if (data.standby.bravo > 0) output += `  Bravo: ${data.standby.bravo}\n`;
                        if (data.standby.charlie > 0) output += `  Charlie: ${data.standby.charlie}\n`;
                        if (data.standby.delta > 0) output += `  Delta: ${data.standby.delta}\n`;
                        output += `Standby Cost: $${data.standby.cost}\n`;
                    } else {
                        output += `Sufficient active capacity. No standby robots required.\n`;
                    }
        
                } else if (level === 4 && data.allocations) {
                    output += `📈 LEVEL 4: Multi-Client Allocation\n`;
                    data.allocations.forEach(c => {
                        const statusIcon = c.status === 'allocated' ? '✅' : c.status === 'standby_required' ? '⚠️' : '❌';
                        output += `Client ${c.client} (${c.hours}h): ${statusIcon} ${c.status.replace(/_/g, ' ')}\n`;
                        if (c.assigned) output += `  ${c.assigned}\n`;
                        if (c.standby) output += `  Standby: ${c.standby}\n`;
                        if (c.error) output += `  Reason: ${c.error}\n`;
                    });
                    if (data.summary) {
                        output += `\n📊 ALLOCATION SUMMARY\n`;
                        output += `Total Robots Used: Bravo=${data.summary.total_robots_used.Bravo}, Charlie=${data.summary.total_robots_used.Charlie}, Delta=${data.summary.total_robots_used.Delta}\n`;
                        output += `Total Charging Cost: $${data.summary.total_cost}\n`;
                        output += `Avg Robot Utilisation: ${data.summary.avg_utilisation}%\n`;

                        // BONUS: Efficiency Metrics Display
                        if (data.summary.efficiency_metrics) {
                            output += `\n📈 EFFICIENCY METRICS\n`;
                            output += `Bravo Utilisation: ${data.summary.efficiency_metrics.Bravo}%\n`;
                            output += `Charlie Utilisation: ${data.summary.efficiency_metrics.Charlie}%\n`;
                            output += `Delta Utilisation: ${data.summary.efficiency_metrics.Delta}%\n`;
                    }
                } else {
                    output = '⚠️ Received an unexpected response format from the server. Check console for details.';
                }

                return output;
            }
        });
    </script>
</body>
</html>
